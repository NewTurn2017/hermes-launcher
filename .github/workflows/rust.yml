name: rust

on:
  push:
    paths:
      - "src-tauri/**"
      - "helper/events.schema.json"
      - "helper/tests/lib/validate_events.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Tauri (a normal dependency, not feature-gated) pulls in webkit2gtk/gtk3,
      # so even `clippy`/`test` without `--features app` must build gdk-sys.
      # python3-jsonschema satisfies the tests/contract.rs validator.
      - name: Linux Tauri + contract-test deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            python3-jsonschema
      # Windows runners already ship `python3`; tests/contract.rs only needs the
      # jsonschema package installed into it.
      - name: Windows contract-test deps
        if: runner.os == 'Windows'
        run: python3 -m pip install jsonschema
      - name: fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --tests
