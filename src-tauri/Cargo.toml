[package]
name = "hermes-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "hermes_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `app` wires the real Tauri context + frontend (enabled in Plan 4).
# Without it, the crate is a backend-logic library testable via `cargo test`.
app = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
encoding_rs = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
